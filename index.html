<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プルガトリウムの夜｜文字起こしの目次</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ef;
      --card: #fffdf8;
      --ink: #252a25;
      --muted: #515952;
      --accent: #25604c;
      --accent-soft: #e8f0e8;
      --line: #d7ddd3;
      font-family: "Atkinson Hyperlegible Next", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.75;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    main { width: min(100% - 2.5rem, 55rem); margin-inline: auto; padding-bottom: 3rem; }
    header { padding-block: clamp(2.4rem, 6vw, 4.75rem) 2rem; }
    h1 { margin: 0; font-size: clamp(1.65rem, 4.5vw, 2.85rem); line-height: 1.35; }
    .credits { margin: .7rem 0 0; color: var(--muted); }

    nav {
      padding: clamp(1rem, 4vw, 1.6rem);
      border: 1px solid var(--line);
      border-radius: .65rem;
      background: var(--card);
    }
    h2 { margin: 0 0 .75rem; font-size: 1.2rem; line-height: 1.4; }
    ol { margin: 0; padding: 0; list-style: none; }
    li + li { border-top: 1px solid var(--line); }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 4.25rem;
      padding: 1rem .75rem;
      border-radius: .3rem;
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      text-underline-offset: .22em;
    }
    a:hover { background: var(--accent-soft); text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--accent-soft); }
    .arrow { font-size: 1.3rem; font-weight: 400; }

    @media (max-width: 28rem) {
      main { width: calc(100% - 1.5rem); }
      a { padding-inline: .5rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>プルガトリウムの夜</h1>
      <p class="credits">KP 豆納豆 ／ PL 五麺、せんじ</p>
    </header>
    <nav aria-labelledby="contents-heading">
      <h2 id="contents-heading">文字起こしの目次</h2>
      <ol role="list">
        <li><a href="purgatorium-day1-transcript-editor.html"><span>一日目</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a href="purgatorium-day2-transcript-editor.html"><span>二日目</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a href="purgatorium-day3-transcript-editor.html"><span>三日目</span><span class="arrow" aria-hidden="true">→</span></a></li>
        <li><a href="purgatorium-day4-transcript-editor.html"><span>四日目</span><span class="arrow" aria-hidden="true">→</span></a></li>
      </ol>
    </nav>
  </main>
</body>
</html>
